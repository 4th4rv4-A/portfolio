<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Atharva Meshram</title>
    <meta name="description" content="The page you're looking for doesn't exist." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="{{ url_for('static', filename='assets/favicon.ico') }}" type="image/x-icon" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            position: relative;
            z-index: 1;
            padding: var(--space-lg);
        }
        .error-page__code {
            font-family: var(--font-mono);
            font-size: clamp(5rem, 20vw, 12rem);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--blue), var(--violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--space-md);
            animation: glitch 3s infinite;
        }
        .error-page__title {
            font-family: var(--font-mono);
            font-size: var(--fs-h2);
            color: var(--text);
            margin-bottom: var(--space-sm);
        }
        .error-page__desc {
            font-family: var(--font-body);
            font-size: var(--fs-body);
            color: var(--text-dim);
            margin-bottom: var(--space-lg);
            max-width: 480px;
        }
        @keyframes glitch {
            0%, 90%, 100% { opacity: 1; }
            91% { opacity: 0.8; transform: translateX(-2px); }
            93% { opacity: 0.9; transform: translateX(2px); }
            95% { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="grid-overlay" aria-hidden="true"></div>
    <main class="error-page">
        <div class="error-page__code" aria-hidden="true">404</div>
        <h1 class="error-page__title">Page Not Found</h1>
        <p class="error-page__desc">
            The page you're looking for doesn't exist or has been moved.
        </p>
        <a href="/" class="btn btn--primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Back to Home
        </a>
    </main>
</body>
</html>
